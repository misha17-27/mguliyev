---
# Развёртывание из cPanel → Git Version Control → Deploy HEAD Commit.
#
# ВНИМАНИЕ. По умолчанию файлы кладутся в отдельную папку, а не в public_html:
# на домене сейчас работает действующий сайт, и перезаписывать его вслепую нельзя.
# Порядок такой:
#   1. нажать Deploy — файлы лягут в ~/mguliyev-new/;
#   2. проверить сайт, указав поддомену document root ~/mguliyev-new/public;
#   3. когда всё устроит — переключить основной домен на тот же путь.
#
# Ничего не удаляется: команды только копируют. Старый сайт остаётся на месте,
# откатиться можно возвратом document root.
#
# Обратная сторона копирования: файл, удалённый из репозитория, в целевой папке
# останется. Для обычных правок это неважно, но после крупной перестройки
# папку ~/mguliyev-new лучше удалить целиком и развернуть заново.
#
# Если решите отдавать сайт прямо из клона репозитория, этот файл не нужен
# вовсе — достаточно указать домену document root
# ~/repositories/mguliyev/public, и тогда «деплой» это Update from Remote.
#
# Важно: app/ обязан лежать РЯДОМ с public, а не внутри него — страницы
# подключают шаблоны по пути ../app/, и из сети эта папка доступна быть не должна.

deployment:
  tasks:
    - export TARGET=$HOME/mguliyev-new
    - /bin/mkdir -p $TARGET/public $TARGET/app
    - /bin/cp -R public/. $TARGET/public/
    - /bin/cp -R app/. $TARGET/app/
    - /bin/echo "Готово. Корень сайта — $TARGET/public"
