---
# Развёртывание из cPanel → Git Version Control → Deploy HEAD Commit.
#
# РАСКЛАДКА. Основной домен в cPanel жёстко привязан к public_html, и сменить
# ему document root из панели нельзя. Поэтому корень сайта кладём прямо туда,
# а шаблоны и данные — в ~/app, рядом с public_html и вне зоны доступа из сети:
#
#   ~/public_html/   корень сайта
#   ~/app/           шаблоны и данные
#   ~/site-data/     правки из панели управления
#
# Третья папка НЕ копируется — она только создаётся, если её ещё нет.
# Туда пишет панель управления, и если бы деплой её перезаписывал, правки
# заказчика пропадали бы при каждой выкладке. По той же причине в ней
# нет ничего из репозитория: содержимое целиком принадлежит серверу.
#
# Страницы подключают шаблоны по пути ../app/, и с такой раскладкой он
# указывает ровно в ~/app. Из сети эта папка недоступна, потому что лежит
# выше корня сайта.
#
# Ничего не удаляется: команды только копируют. Обратная сторона — файл,
# удалённый из репозитория, в public_html останется. После крупной
# перестройки папку лучше очистить вручную и развернуть заново.
#
# Старый сайт на WordPress живёт на другом сервере и этим деплоем не
# затрагивается. Откат — вернуть DNS в Cloudflare на прежний адрес.

deployment:
  tasks:
    - export WEB=$HOME/public_html
    - export APP=$HOME/app
    - export DATA=$HOME/site-data
    # $DATA/uploads тут был лишним: загруженные картинки лежат в корне сайта,
    # иначе их не отдать по адресу. В site-data — то, что из сети видеть нельзя:
    # заявки с именами и телефонами, счётчики попыток, сессии панели.
    - /bin/mkdir -p $WEB $APP $DATA $DATA/leads $DATA/locks $DATA/sessions $WEB/images/uploads
    - /bin/cp -R public/. $WEB/
    - /bin/cp -R app/. $APP/
    - /bin/chmod 750 $DATA $DATA/leads $DATA/locks $DATA/sessions
    - /bin/echo "Готово. Корень — $WEB, шаблоны — $APP, данные панели — $DATA"
